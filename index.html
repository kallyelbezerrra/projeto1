<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Lista de Alunos</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 20px;
    }

    input {
      padding: 10px;
      width: 200px;
    }

    button {
      padding: 10px;
      margin-left: 5px;
      cursor: pointer;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 20px;
      max-width: 300px;
      margin-left: auto;
      margin-right: auto;
    }

    li {
      padding: 10px;
    }

    /* Lista zebrada */
    li:nth-child(odd) {
      background-color: #f2f2f2;
    }

    li:nth-child(even) {
      background-color: #dcdcdc;
    }
  </style>
</head>
<body>

  <h2>Cadastro de Alunos</h2>

  <input type="text" id="nome" placeholder="Digite o nome">
  <button onclick="enviar()">Adicionar</button>

  <ul id="lista"></ul>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzyFMyldIDQsZRUMo78RPzELmSxBMCnmFw3vVIF11SjxebVG7_Q89l2aytnTeGvrA/exec";

async function carregarLista() {
  const res = await fetch(API_URL);
  const nomes = await res.json();

  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  nomes.forEach(nome => {
    const li = document.createElement("li");
    li.textContent = nome;
    lista.appendChild(li);
  });
}

async function enviar() {
  const input = document.getElementById("nome");
  const nome = input.value.trim();

  if (!nome) return;

  await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ nome })
  });

  input.value = "";
  carregarLista();
}

// Carrega ao abrir
carregarLista();
</script>

</body>
</html>
